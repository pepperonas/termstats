[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termstats"
version = "0.5.0"
description = "Beautiful terminal server dashboard with real-time charts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Martin Pfeffer", email = "support@celox.io" },
]
keywords = [
    "terminal", "dashboard", "monitoring", "system", "cpu", "memory",
    "server", "devops", "sysadmin", "tui", "charts", "cli",
    "audio", "spectrum", "equalizer", "bpm", "decibel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9",
    "plotext>=5.2,<6",
    "rich>=13.0",
]

[project.optional-dependencies]
# The microphone modes (-eq / -bpm / -db) need an FFT and a capture library; the system
# dashboard does not, and stays installable without them.
audio = ["numpy>=1.24", "sounddevice>=0.4.6"]
dev = ["pytest>=7.0", "numpy>=1.24", "sounddevice>=0.4.6"]

[project.urls]
Homepage = "https://github.com/pepperonas/termstats"
Repository = "https://github.com/pepperonas/termstats"
Issues = "https://github.com/pepperonas/termstats/issues"

[project.scripts]
termstats = "termstats.cli:main"

[tool.setuptools.packages.find]
include = ["termstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
