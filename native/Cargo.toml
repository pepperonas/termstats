[package]
name = "termstats-native"
version = "0.11.0"
edition = "2021"
description = "The native core of termstats: the system dashboard at a fraction of the CPU"
license = "MIT"
repository = "https://github.com/pepperonas/termstats"

[[bin]]
name = "termstats-native"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
