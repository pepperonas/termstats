name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # The floor claimed in pyproject.toml - keep it honest.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show the resolved dependency versions
        # A fresh resolve is exactly how the plotext 6.0.0 break arrived; print it.
        run: pip list | grep -Ei 'psutil|plotext|rich'

      - name: Unit tests
        run: pytest

      - name: CLI smoke test
        # --once is explicit on purpose. A bare `termstats` would also print a snapshot
        # here (the runner's stdout is not a terminal), but relying on that would make
        # this step hang forever the day the terminal check regresses.
        run: |
          termstats --version
          termstats --help
          COLUMNS=150 LINES=45 termstats --once > /dev/null
          COLUMNS=150 LINES=45 termstats > snapshot.txt
          test -s snapshot.txt

      - name: PowerShell smoke test
        # The step above runs under Git Bash even on Windows. PowerShell 7.4+ passes a
        # native command's bytes through to the file, so the snapshot must come back as
        # UTF-8 with the bar glyph in it - which proves the cp1252 widening AND the
        # shell's byte redirection in one go.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:COLUMNS = '150'; $env:LINES = '45'
          termstats --once > ps-snapshot.txt
          if ((Get-Item ps-snapshot.txt).Length -eq 0) { throw 'empty snapshot' }
          $text = Get-Content ps-snapshot.txt -Raw -Encoding utf8
          if ($text -notmatch 'TERMSTATS') { throw 'no header in the snapshot' }
          if (-not $text.Contains([string][char]0x2588)) { throw 'bar glyph lost on the way to the file' }
          termstats > ps-live-default.txt
          if ((Get-Item ps-live-default.txt).Length -eq 0) { throw 'a redirected bare termstats must still print' }

      - name: Badge files are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python tools/badges.py --check || echo "::notice::badge files will be refreshed by the badges job"
