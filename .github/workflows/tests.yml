name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # The floor claimed in pyproject.toml - keep it honest.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show the resolved dependency versions
        # A fresh resolve is exactly how the plotext 6.0.0 break arrived; print it.
        run: pip list | grep -Ei 'psutil|plotext|rich'

      - name: Unit tests
        run: pytest

      - name: CLI smoke test
        run: |
          termstats --version
          termstats --help
          COLUMNS=150 LINES=45 termstats > /dev/null
